name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Changelog notes
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          test -s release_notes.md || echo "Release ${VERSION}" > release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  build-binaries:
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Upload assets when build succeeds
        if: success()
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          name=cloud-netconfig-linux-x86_64
          mkdir -p "${name}"
          cp target/release/cloud-netconfigd target/release/cnctl "${name}/"
          cp README.md CHANGELOG.md LICENSE.txt "${name}/"
          tar czf "${name}-${v}.tar.gz" "${name}"
        continue-on-error: true
